  name: 米味小兔や~ # 作者名称
  description: 这里，我们不止生产妹汁；众多软件中总有一款适合你！ # 网站描述
  avatar: /img/avatar.png # 网站头像（原站 images/avatar.png）
  showLogo: true # 是否显示 Logo
  author: 米味小兔や~ # 作者名称
  url: https://zhulinyv.github.io # 站点 URL 用于 RSS 和 SEO
  defaultOgImage: /img/avatar.png # 默认 Open Graph 图片
  startYear: 2020 # 建站年份（最早文章 2020-12-31）
  timezone: Asia/Shanghai # 时区配置 (IANA 格式)，用于日期显示和处理
  keywords: # SEO 关键词 (全局)
